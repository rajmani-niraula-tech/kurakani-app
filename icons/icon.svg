<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#glowGrad)" stroke-width="6" opacity="0.4"/>

  <!-- Outer Glowing Circle -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#glowGrad)" stroke-width="12" opacity="0.3" />
  <circle cx="256" cy="256" r="140" fill="url(#glowGrad)" opacity="0.15" />

  <!-- Signal waves / P2P rings -->
  <path d="M 340 180 A 110 110 0 0 1 380 260" fill="none" stroke="#10b981" stroke-width="14" stroke-linecap="round" opacity="0.8"/>
  <path d="M 370 150 A 150 150 0 0 1 420 260" fill="none" stroke="#06b6d4" stroke-width="14" stroke-linecap="round" opacity="0.7"/>

  <!-- Phone Handset Icon (angled active call position) -->
  <g transform="translate(256, 260) rotate(-15) translate(-256, -260)" filter="url(#glow)">
    <path d="M 195 155 
             C 185 155 175 160 168 170 
             L 145 205 
             C 138 215 137 230 144 245 
             C 165 290 220 345 265 366 
             C 280 373 295 372 305 365 
             L 340 342 
             C 350 335 355 325 355 315 
             C 355 305 348 295 338 290 
             L 295 270 
             C 285 265 273 268 266 276 
             L 255 288 
             C 230 275 210 255 197 230 
             L 209 219 
             C 217 212 220 200 215 190 
             L 195 147 
             Z" 
          fill="url(#glowGrad)"/>
  </g>

  <!-- Video Camera accent dot -->
  <circle cx="365" cy="365" r="32" fill="#6366f1" />
  <polygon points="354,352 354,378 378,365" fill="#ffffff" />
</svg>
